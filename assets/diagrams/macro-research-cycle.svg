<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc" viewBox="0 0 900 360"><title id="svg-title">可复盘的宏观金融研究闭环</title><desc id="svg-desc">研究问题经过数据口径审计、机制建模与多情景推演，形成报告，并通过之后的观测与误差复盘重新修订。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#147f80"/></marker></defs><rect width="900" height="360" rx="16" fill="#fffdf9"/><rect x="20" y="110" width="155" height="106" rx="15" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="97.5" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">研究问题</text><text x="97.5" y="171" text-anchor="middle" font-size="13" fill="#53676d">日期 / 经济体</text><rect x="201" y="110" width="155" height="106" rx="15" fill="#f4effb" stroke="#7461ba" stroke-width="2"/><text x="278.5" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">数据审计</text><text x="278.5" y="171" text-anchor="middle" font-size="13" fill="#53676d">原始源 / 版本</text><rect x="382" y="110" width="155" height="106" rx="15" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="459.5" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">机制模型</text><text x="459.5" y="171" text-anchor="middle" font-size="13" fill="#53676d">利率 / 信贷</text><rect x="563" y="110" width="155" height="106" rx="15" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="640.5" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">政策情景</text><text x="640.5" y="171" text-anchor="middle" font-size="13" fill="#53676d">基准 / 反证</text><rect x="744" y="110" width="135" height="106" rx="15" fill="#fbf4df" stroke="#916c22" stroke-width="2"/><text x="811.5" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">复盘修订</text><text x="811.5" y="171" text-anchor="middle" font-size="13" fill="#53676d">误差 / 归档</text>
