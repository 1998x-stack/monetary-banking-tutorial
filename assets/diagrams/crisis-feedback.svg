<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc" viewBox="0 0 900 360"><title id="svg-title">杠杆与融资流动性构成的危机反馈环</title><desc id="svg-desc">从乐观估值到杠杆融资，风险冲击引发保证金要求、资产抛售和金融条件收紧，再影响资产估值。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#147f80"/></marker></defs><rect width="900" height="360" rx="16" fill="#fffdf9"/><rect x="35" y="102" width="165" height="110" rx="15" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="117.5" y="137" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">繁荣与信心</text><text x="117.5" y="163" text-anchor="middle" font-size="13" fill="#53676d">资产估值改善</text><rect x="260" y="102" width="165" height="110" rx="15" fill="#f4effb" stroke="#7461ba" stroke-width="2"/><text x="342.5" y="137" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">加杠杆</text><text x="342.5" y="163" text-anchor="middle" font-size="13" fill="#53676d">短期融资与错配</text><rect x="485" y="102" width="165" height="110" rx="15" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="567.5" y="137" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">压力冲击</text><text x="567.5" y="163" text-anchor="middle" font-size="13" fill="#53676d">保证金与赎回</text><rect x="710" y="102" width="155" height="110" rx="15" fill="#fbf4df" stroke="#916c22" stroke-width="2"/><text x="787.5" y="137" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">被迫出售</text><text x="787.5" y="163" text-anchor="middle" font-size="13" fill="#53676d">资产价格下降</text>
 <path d="M200 157 L260 157" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/><path d="M425 157 L485 157" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 157 L710 157" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/>
 <path d="M787 214 C787 310 110 310 110 214" stroke="#d06d4d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
 <text x="450" y="292" font-size="14" fill="#a4553b" font-weight="700" text-anchor="middle">融资收缩与价格跌幅彼此放大</text>
 <text x="450" y="46" font-size="14" fill="#53676d" text-anchor="middle">反馈不必然发生，但高杠杆、共同持仓和短期融资会提高脆弱性</text></svg>