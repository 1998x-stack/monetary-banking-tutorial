<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">货币政策工具如何连接宏观目标</title><desc id="svg-desc">政策目标通过操作目标和央行工具影响短期市场利率与金融条件，再传导到产出、就业和物价。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#147f80"/></marker><marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d06d4d"/></marker></defs><rect x="35" y="125" width="160" height="95" rx="14" fill="#f7f8f4" stroke="#a6b8b0" stroke-width="2"/><text x="115" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">政策目标</text><text x="115" y="179" text-anchor="middle" font-size="13" fill="#53676d">物价 · 就业 · 稳定</text><rect x="270" y="125" width="155" height="95" rx="14" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="347.5" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">操作目标</text><text x="347.5" y="179" text-anchor="middle" font-size="13" fill="#53676d">短期利率 / 准备金</text><rect x="505" y="35" width="170" height="82" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="590" y="65" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">价格工具</text><text x="590" y="89" text-anchor="middle" font-size="13" fill="#53676d">政策利率 · 走廊</text><rect x="505" y="140" width="170" height="82" rx="14" fill="#f4effb" stroke="#7461ba" stroke-width="2"/><text x="590" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">数量工具</text><text x="590" y="194" text-anchor="middle" font-size="13" fill="#53676d">OMO · 准备金</text><rect x="505" y="245" width="170" height="82" rx="14" fill="#fbf4df" stroke="#916c22" stroke-width="2"/><text x="590" y="275" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">定向工具</text><text x="590" y="299" text-anchor="middle" font-size="13" fill="#53676d">再贷款 · 再贴现</text><rect x="745" y="125" width="130" height="95" rx="14" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="810" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">金融条件</text><text x="810" y="179" text-anchor="middle" font-size="13" fill="#53676d">融资 · 资产价格</text>
