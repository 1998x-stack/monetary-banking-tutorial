<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">货币政策的多渠道传导机制</title><desc id="svg-desc">政策利率和央行操作影响市场利率、信贷、资产价格、汇率与预期，再通过家庭企业支出影响总需求和价格。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#147f80"/></marker><marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d06d4d"/></marker></defs><rect x="25" y="125" width="145" height="92" rx="14" fill="#f7f8f4" stroke="#a6b8b0" stroke-width="2"/><text x="97.5" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">政策操作</text><text x="97.5" y="179" text-anchor="middle" font-size="13" fill="#53676d">利率 / 流动性</text>
<rect x="230" y="25" width="155" height="70" rx="14" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="307.5" y="55" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">利率渠道</text><text x="307.5" y="79" text-anchor="middle" font-size="13" fill="#53676d">融资成本</text>
<rect x="230" y="110" width="155" height="70" rx="14" fill="#f4effb" stroke="#7461ba" stroke-width="2"/><text x="307.5" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">信贷渠道</text><text x="307.5" y="164" text-anchor="middle" font-size="13" fill="#53676d">供给与需求</text>
<rect x="230" y="195" width="155" height="70" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="307.5" y="225" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">资产价格</text><text x="307.5" y="249" text-anchor="middle" font-size="13" fill="#53676d">财富与抵押品</text>
<rect x="230" y="280" width="155" height="70" rx="14" fill="#fbf4df" stroke="#916c22" stroke-width="2"/><text x="307.5" y="310" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">汇率 / 预期</text><text x="307.5" y="334" text-anchor="middle" font-size="13" fill="#53676d">外部价格与信心</text>
<rect x="470" y="125" width="155" height="92" rx="14" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="547.5" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">支出决策</text><text x="547.5" y="179" text-anchor="middle" font-size="13" fill="#53676d">消费 · 投资</text>
<rect x="710" y="125" width="165" height="92" rx="14" fill="#f4effb" stroke="#7461ba" stroke-width="2"/><text x="792.5" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">宏观结果</text><text x="792.5" y="179" text-anchor="middle" font-size="13" fill="#53676d">产出 · 就业 · 物价</text>
<path d="M170 170 L230 60" stroke="#147f80" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M170 170 L230 145" stroke="#147f80" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M170 170 L230 230" stroke="#147f80" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M170 170 L230 315" stroke="#147f80" stroke-width="3" fill="none"  marker-end="url(#arrow)"/>
