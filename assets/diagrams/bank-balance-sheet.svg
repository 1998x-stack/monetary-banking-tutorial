<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">商业银行资产负债表</title><desc id="fig-desc">左侧资产端列示准备金、贷款和证券，右侧负债与权益端列示存款、批发融资和资本。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker><marker id="arr-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#d06d4d"/></marker></defs><rect width="960" height="480" rx="24" fill="#fffdf9"/>
<text x="480" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#203035">资产 = 负债 + 所有者权益</text>
<rect x="60" y="100" width="380" height="74" rx="16" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="78" y="134" fill="#203035" font-size="20" font-weight="700">资产：资金用途</text><text x="78" y="166" fill="#42565a" font-size="16">准备金 · 贷款 · 债券投资</text>
<rect x="520" y="100" width="380" height="74" rx="16" fill="#fbf4df" stroke="#916c22" stroke-width="2"/><text x="538" y="134" fill="#203035" font-size="20" font-weight="700">负债：资金来源</text><text x="538" y="166" fill="#42565a" font-size="16">客户存款 · 同业融资 · 债券</text>
<rect x="60" y="205" width="380" height="74" rx="16" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="78" y="239" fill="#203035" font-size="20" font-weight="700">生息资产</text><text x="78" y="271" fill="#42565a" font-size="16">贷款利息与证券收益</text>
<rect x="520" y="205" width="380" height="74" rx="16" fill="#fbf4df" stroke="#916c22" stroke-width="2"/><text x="538" y="239" fill="#203035" font-size="20" font-weight="700">付息负债</text><text x="538" y="271" fill="#42565a" font-size="16">存款利息与批发融资成本</text>
<rect x="290" y="315" width="380" height="74" rx="16" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="308" y="349" fill="#203035" font-size="20" font-weight="700">权益资本</text><text x="308" y="381" fill="#42565a" font-size="16">吸收损失 · 支持风险加权资产</text>
<path d="M250 175 V200 M710 175 V200 M250 280 L390 310 M710 280 L570 310" stroke="#147f80" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<text x="480" y="438" text-anchor="middle" font-size="16" fill="#52686b">银行经营同时受收益、风险、流动性与资本约束</text></svg>