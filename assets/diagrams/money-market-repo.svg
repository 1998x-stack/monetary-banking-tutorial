<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">回购融资流程</title><desc id="fig-desc">资金需求方以债券作为抵押品获得短期现金，到期支付资金成本并取回证券。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker><marker id="arr-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#d06d4d"/></marker></defs><rect width="960" height="480" rx="24" fill="#fffdf9"/>
<rect x="45" y="120" width="245" height="100" rx="16" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="63" y="154" fill="#203035" font-size="20" font-weight="700">资金需求方</text><text x="63" y="186" fill="#42565a" font-size="16">提供抵押品 · 融入现金</text>
<rect x="670" y="120" width="245" height="100" rx="16" fill="#fbf4df" stroke="#916c22" stroke-width="2"/><text x="688" y="154" fill="#203035" font-size="20" font-weight="700">资金提供方</text><text x="688" y="186" fill="#42565a" font-size="16">提供现金 · 接收抵押品</text>
<path d="M300 145 H655" stroke="#147f80" stroke-width="4" marker-end="url(#arr)"/>
<text x="480" y="130" text-anchor="middle" font-size="18" fill="#147f80" font-weight="700">现金流向借款方</text>
<path d="M655 195 H300" stroke="#d06d4d" stroke-width="4" marker-end="url(#arr-warm)"/>
<text x="480" y="225" text-anchor="middle" font-size="18" fill="#d06d4d" font-weight="700">抵押品 / 证券安排</text>
<rect x="255" y="300" width="450" height="85" rx="18" fill="#203035"/>
<text x="480" y="336" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">到期结算</text>
<text x="480" y="365" text-anchor="middle" font-size="16" fill="#d8e7e1">偿还本金 + 利息 · 解除质押 / 返还债券</text></svg>