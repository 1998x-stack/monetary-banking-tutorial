<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">货币需求的三类动机</title>
<desc id="svg-desc">交易动机来自收入与支出时点不同，预防动机来自不确定性，投机动机来自货币与债券之间的收益和价格预期；三者共同决定希望持有的流动性余额。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#147f80"/></marker></defs>
<rect x="30" y="36" width="245" height="82" rx="14" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/>
<text x="152" y="68" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">交易动机</text>
<text x="152" y="95" text-anchor="middle" font-size="14" fill="#53676d">收入与支出不同步</text>
<rect x="30" y="139" width="245" height="82" rx="14" fill="#fbf4df" stroke="#916c22" stroke-width="2"/>
<text x="152" y="171" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">预防动机</text>
<text x="152" y="198" text-anchor="middle" font-size="14" fill="#53676d">不确定支出与应急缓冲</text>
<rect x="30" y="242" width="245" height="82" rx="14" fill="#f4effb" stroke="#7461ba" stroke-width="2"/>
<text x="152" y="274" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">投机动机</text>
<text x="152" y="301" text-anchor="middle" font-size="14" fill="#53676d">利率、债券价格与预期</text>
<rect x="365" y="108" width="210" height="144" rx="18" fill="#f7f8f4" stroke="#a6b8b0" stroke-width="2"/>
<text x="470" y="153" text-anchor="middle" font-size="19" font-weight="700" fill="#203035">流动性选择</text>
<text x="470" y="183" text-anchor="middle" font-size="14" fill="#53676d">货币余额</text>
<text x="470" y="207" text-anchor="middle" font-size="14" fill="#53676d">与其他资产之间权衡</text>
<rect x="665" y="108" width="205" height="144" rx="18" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/>
<text x="767" y="153" text-anchor="middle" font-size="19" font-weight="700" fill="#203035">货币需求</text>
<text x="767" y="183" text-anchor="middle" font-size="14" fill="#53676d">实际余额 Md / P</text>
<text x="767" y="207" text-anchor="middle" font-size="14" fill="#53676d">受收入与利率影响</text>
<path d="M275 77 L365 145 M275 180 L365 180 M275 283 L365 215" stroke="#147f80" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M575 180 L665 180" stroke="#147f80" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="470" y="345" text-anchor="middle" font-size="13" fill="#53676d">同一笔余额可能同时满足多种动机；分类用于分析，不是互斥账户</text>
</svg>