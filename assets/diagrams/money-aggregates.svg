<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
<title id="t">中国现行 M0、M1 与 M2 的包含关系</title><desc id="d">M0 是流通中现金；自 2025 年 1 月起，M1 在 M0 之外还包括单位活期存款、个人活期存款和非银行支付机构客户备付金；M2 是更广义的货币统计口径，还包括相应的定期及其他存款类项目。</desc>
<rect x="36" y="34" width="828" height="282" rx="20" fill="#f2eef9" stroke="#b8a9d6" stroke-width="2"/><text x="68" y="70" font-size="24" font-weight="750" fill="#3e3454">M2 · 广义货币</text><text x="68" y="98" font-size="14" fill="#625a72">更广的存款与货币性项目</text>
<rect x="88" y="126" width="724" height="160" rx="18" fill="#e8f4f1" stroke="#8dbab0" stroke-width="2"/><text x="120" y="160" font-size="22" font-weight="750" fill="#203b3d">M1 · 狭义货币（2025 年起修订口径）</text>
<rect x="122" y="190" width="180" height="70" rx="12" fill="#fff" stroke="#77a99d"/><text x="212" y="220" text-anchor="middle" font-size="20" font-weight="700" fill="#147f80">M0</text><text x="212" y="244" text-anchor="middle" font-size="13" fill="#52676a">流通中现金</text>
<rect x="326" y="190" width="220" height="70" rx="12" fill="#fff" stroke="#77a99d"/><text x="436" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="#147f80">活期存款</text><text x="436" y="244" text-anchor="middle" font-size="13" fill="#52676a">单位 + 个人</text>
<rect x="570" y="190" width="210" height="70" rx="12" fill="#fff" stroke="#77a99d"/><text x="675" y="220" text-anchor="middle" font-size="17" font-weight="700" fill="#147f80">客户备付金</text><text x="675" y="244" text-anchor="middle" font-size="13" fill="#52676a">非银行支付机构</text>
<text x="450" y="342" text-anchor="middle" font-size="13" fill="#667578">M2 还包括定期存款等更广义项目；具体边界以当期官方统计制度为准</text>
</svg>