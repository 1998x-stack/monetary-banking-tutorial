<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc" viewBox="0 0 900 360"><title id="svg-title">数字货币、银行存款与数字人民币实名钱包的法律关系</title><desc id="svg-desc">中央银行货币、银行存款和2026年商业银行运营的实名数字人民币钱包具有不同的负债与保护安排，支付终端形式并不决定负债主体。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#147f80"/></marker></defs><rect width="900" height="360" rx="16" fill="#fffdf9"/><rect x="25" y="100" width="210" height="110" rx="15" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="130" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">央行货币</text><text x="130" y="161" text-anchor="middle" font-size="13" fill="#53676d">现金 / 银行准备金</text><rect x="340" y="100" width="210" height="110" rx="15" fill="#f4effb" stroke="#7461ba" stroke-width="2"/><text x="445" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">银行存款</text><text x="445" y="161" text-anchor="middle" font-size="13" fill="#53676d">商业银行负债</text><rect x="655" y="100" width="220" height="110" rx="15" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="765" y="135" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">实名 e-CNY 钱包</text><text x="765" y="161" text-anchor="middle" font-size="13" fill="#53676d">2026 银行存款框架</text>
 <path d="M235 155 L340 155" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/><path d="M550 155 L655 155" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/>
 <text x="445" y="264" text-anchor="middle" font-size="14" fill="#53676d">2026 年调整涉及银行运营钱包的计息、存款保险和准备金管理</text>
 <text x="445" y="305" text-anchor="middle" font-size="13" fill="#a4553b">箭头仅表示制度与结算联系，不表示三类余额法律性质完全一致</text>
 <text x="450" y="45" text-anchor="middle" font-size="16" fill="#203035" font-weight="700">问：谁是负债人？哪些钱包？适用哪一年的规则？</text></svg>