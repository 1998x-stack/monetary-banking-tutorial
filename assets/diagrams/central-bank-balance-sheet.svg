<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">中央银行资产负债表</title><desc id="fig-desc">中央银行资产端包含外汇资产、对金融机构债权和证券；负债端包含现金、准备金和政府存款。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker><marker id="arr-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#d06d4d"/></marker></defs><rect width="960" height="480" rx="24" fill="#fffdf9"/>
<text x="480" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#203035">中央银行的会计视角</text>
<rect x="55" y="105" width="390" height="88" rx="16" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="73" y="139" fill="#203035" font-size="20" font-weight="700">资产端</text><text x="73" y="171" fill="#42565a" font-size="16">外汇资产 · 对金融机构债权 · 政府证券</text>
<rect x="515" y="105" width="390" height="88" rx="16" fill="#fbf4df" stroke="#916c22" stroke-width="2"/><text x="533" y="139" fill="#203035" font-size="20" font-weight="700">负债端</text><text x="533" y="171" fill="#42565a" font-size="16">流通现金 · 银行准备金 · 政府存款</text>
