<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc" viewBox="0 0 900 360"><title id="svg-title">预测时点的信息边界</title><desc id="svg-desc">预测时点 t 之前的信息可用于估计，预测对象与事后修订位于未来；回测不可混用。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#147f80"/></marker></defs><rect width="900" height="360" rx="16" fill="#fffdf9"/><rect x="35" y="88" width="440" height="188" rx="16" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/>
 <rect x="500" y="88" width="360" height="188" rx="16" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/>
 <text x="255" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">预测时点之前</text>
 <text x="255" y="160" text-anchor="middle" font-size="15" fill="#53676d">截至 t 已发布的统计值与版本</text>
 <text x="255" y="191" text-anchor="middle" font-size="15" fill="#53676d">已知政策、市场价格和历史数据</text>
 <text x="255" y="222" text-anchor="middle" font-size="15" fill="#53676d">训练数据与模型参数</text>
 <text x="675" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">预测时点之后</text>
 <text x="675" y="160" text-anchor="middle" font-size="15" fill="#53676d">未来目标与真实结果</text>
 <text x="675" y="191" text-anchor="middle" font-size="15" fill="#53676d">以后修订的历史数据</text>
 <text x="675" y="222" text-anchor="middle" font-size="15" fill="#53676d">事后新闻与后验解释</text>
 <path d="M488 42 L488 304" stroke="#d06d4d" stroke-width="4" stroke-dasharray="8 6"/>
 <text x="488" y="33" text-anchor="middle" font-size="17" fill="#a4553b" font-weight="700">时点 t</text>
 <text x="450" y="340" text-anchor="middle" font-size="14" fill="#53676d">严格遵守信息边界，才能避免回测中的未来数据泄漏</text></svg>