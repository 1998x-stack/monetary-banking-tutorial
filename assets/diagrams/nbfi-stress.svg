<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">非银行机构的流动性压力反馈</title><desc id="svg-desc">投资者赎回或批发融资收紧导致资产出售，资产价格下跌后抵押品折扣和保证金要求上升，进一步放大现金需求。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#147f80"/></marker><marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d06d4d"/></marker></defs><rect x="45" y="120" width="160" height="92" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="125" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">赎回 / 融资收紧</text><text x="125" y="174" text-anchor="middle" font-size="13" fill="#53676d">现金需求上升</text><rect x="270" y="120" width="160" height="92" rx="14" fill="#f7f8f4" stroke="#a6b8b0" stroke-width="2"/><text x="350" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">出售资产</text><text x="350" y="174" text-anchor="middle" font-size="13" fill="#53676d">折价成交</text><rect x="495" y="120" width="160" height="92" rx="14" fill="#f4effb" stroke="#7461ba" stroke-width="2"/><text x="575" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">价格下跌</text><text x="575" y="174" text-anchor="middle" font-size="13" fill="#53676d">抵押品价值下降</text><rect x="720" y="120" width="145" height="92" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="792.5" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">追加保证金</text><text x="792.5" y="174" text-anchor="middle" font-size="13" fill="#53676d">现金缺口扩大</text>
<path d="M205 166 L270 166" stroke="#147f80" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M430 166 L495 166" stroke="#147f80" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M655 166 L720 166" stroke="#147f80" stroke-width="3" fill="none"  marker-end="url(#arrow)"/>
<path d="M792 212 C792 310 125 310 125 212" fill="none" stroke="#d06d4d" stroke-width="3" marker-end="url(#arrow-warm)"/><text x="450" y="300" text-anchor="middle" font-size="15" fill="#a4553b" font-weight="700">被迫卖出与再融资困难形成反馈环</text>
<text x="450" y="55" text-anchor="middle" font-size="14" fill="#53676d">高杠杆 + 期限错配 + 共同持仓，会放大市场压力</text></svg>