<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="t d">
<title id="t">国际货币制度演变时间线</title><desc id="d">古典金本位在 19 世纪后期至 1914 年扩展；1944 年布雷顿森林会议设计战后固定但可调整的汇率安排；1971 年美国暂停美元兑换黄金；1973 年主要货币转向浮动；1976 年牙买加达成改革共识，第二次修订后的 IMF 协定于 1978 年生效。</desc>
<line x1="90" y1="148" x2="810" y2="148" stroke="#8ba19c" stroke-width="5" stroke-linecap="round"/>
<g fill="#147f80"><circle cx="120" cy="148" r="11"/><circle cx="330" cy="148" r="11"/><circle cx="500" cy="148" r="11"/><circle cx="650" cy="148" r="11"/><circle cx="790" cy="148" r="11"/></g>
<g font-family="system-ui,sans-serif"><text x="120" y="54" text-anchor="middle" font-size="21" font-weight="700" fill="#203b3d">1870s–1914</text><text x="120" y="81" text-anchor="middle" font-size="14" fill="#52676a">古典金本位</text><text x="120" y="101" text-anchor="middle" font-size="12" fill="#52676a">货币与黄金挂钩</text>
<text x="330" y="207" text-anchor="middle" font-size="21" font-weight="700" fill="#203b3d">1944 / 1958</text><text x="330" y="234" text-anchor="middle" font-size="14" fill="#52676a">布雷顿森林设计 / 运行</text><text x="330" y="254" text-anchor="middle" font-size="12" fill="#52676a">美元兑金，其他货币盯住美元</text>
<text x="500" y="54" text-anchor="middle" font-size="21" font-weight="700" fill="#b75a3c">1971</text><text x="500" y="81" text-anchor="middle" font-size="14" fill="#52676a">关闭黄金窗口</text><text x="500" y="101" text-anchor="middle" font-size="12" fill="#52676a">美元停止官方兑金</text>
<text x="650" y="207" text-anchor="middle" font-size="21" font-weight="700" fill="#203b3d">1973</text><text x="650" y="234" text-anchor="middle" font-size="14" fill="#52676a">主要货币浮动</text><text x="650" y="254" text-anchor="middle" font-size="12" fill="#52676a">固定汇率体系瓦解</text>
<text x="790" y="54" text-anchor="middle" font-size="21" font-weight="700" fill="#203b3d">1976 / 1978</text><text x="790" y="81" text-anchor="middle" font-size="14" fill="#52676a">牙买加共识 / 修订生效</text><text x="790" y="101" text-anchor="middle" font-size="12" fill="#52676a">汇率安排选择更灵活</text></g>
<text x="450" y="302" text-anchor="middle" font-size="13" fill="#667578">注意：会议达成协议、制度实际运行和法律修订生效是不同时间节点</text>
</svg>