<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc" viewBox="0 0 900 360"><title id="svg-title">三类代币化货币的负债关系</title><desc id="svg-desc">私人稳定币对应发行人的赎回义务；代币化存款对应商业银行存款负债；代币化中央银行货币依据央行规则形成最终结算安排。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#147f80"/></marker></defs><rect width="900" height="360" rx="16" fill="#fffdf9"/><rect x="28" y="110" width="235" height="110" rx="15" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="145.5" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">法币稳定币</text><text x="145.5" y="171" text-anchor="middle" font-size="13" fill="#53676d">私人发行人 / 储备与赎回</text><rect x="330" y="110" width="235" height="110" rx="15" fill="#f4effb" stroke="#7461ba" stroke-width="2"/><text x="447.5" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">代币化存款</text><text x="447.5" y="171" text-anchor="middle" font-size="13" fill="#53676d">商业银行负债 / 存款规则</text><rect x="635" y="110" width="235" height="110" rx="15" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="752.5" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">央行数字货币</text><text x="752.5" y="171" text-anchor="middle" font-size="13" fill="#53676d">央行负债 / 结算规则</text>
