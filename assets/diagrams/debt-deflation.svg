<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">债务通缩的反馈机制</title><desc id="svg-desc">固定名义债务在价格水平下降时实际负担上升，借款人削减支出和抛售资产，导致收入与资产价格进一步下降。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#147f80"/></marker><marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d06d4d"/></marker></defs><rect x="35" y="120" width="155" height="100" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="112.5" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">价格水平下降</text><text x="112.5" y="174" text-anchor="middle" font-size="13" fill="#53676d">P ↓</text><rect x="260" y="120" width="155" height="100" rx="14" fill="#f4effb" stroke="#7461ba" stroke-width="2"/><text x="337.5" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">实际债务上升</text><text x="337.5" y="174" text-anchor="middle" font-size="13" fill="#53676d">D / P ↑</text><rect x="485" y="120" width="155" height="100" rx="14" fill="#f7f8f4" stroke="#a6b8b0" stroke-width="2"/><text x="562.5" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">去杠杆与抛售</text><text x="562.5" y="174" text-anchor="middle" font-size="13" fill="#53676d">消费 / 投资 ↓</text><rect x="710" y="120" width="155" height="100" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="787.5" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">收入与资产下跌</text><text x="787.5" y="174" text-anchor="middle" font-size="13" fill="#53676d">偿债能力 ↓</text>
<path d="M190 170 L260 170" stroke="#147f80" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M415 170 L485 170" stroke="#147f80" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M640 170 L710 170" stroke="#147f80" stroke-width="3" fill="none"  marker-end="url(#arrow)"/>
<path d="M790 220 C790 315 110 315 110 220" fill="none" stroke="#d06d4d" stroke-width="3" marker-end="url(#arrow-warm)"/><text x="450" y="303" text-anchor="middle" font-size="15" font-weight="700" fill="#a4553b">债务、价格和需求之间的负反馈</text>
<text x="450" y="55" text-anchor="middle" font-size="14" fill="#53676d">当名义债务刚性、杠杆高且收入同步下行时，风险更大</text></svg>