<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d">
<title id="t">货币金融体系中的资金流与资产负债关系</title><desc id="d">家庭和企业通过银行存款完成支付，商业银行提供信贷并持有准备金，中央银行提供结算资产并实施货币政策，金融市场连接储蓄与融资。</desc>
<defs><marker id="arr1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#147f80" stroke-width="1.4"/></marker><marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#d06d4d" stroke-width="1.4"/></marker></defs>
<rect x="24" y="48" width="190" height="92" rx="15" fill="#e8f4f1" stroke="#8dbab0"/><text x="119" y="83" text-anchor="middle" font-size="22" fill="#203b3d" font-weight="700">家庭与企业</text><text x="119" y="111" text-anchor="middle" font-size="14" fill="#52676a">收入 · 消费 · 投资</text>
<rect x="350" y="48" width="200" height="92" rx="15" fill="#fff0e9" stroke="#d9a08c"/><text x="450" y="83" text-anchor="middle" font-size="22" fill="#4b3028" font-weight="700">商业银行</text><text x="450" y="111" text-anchor="middle" font-size="14" fill="#6b534b">存款 · 贷款 · 支付</text>
<rect x="686" y="48" width="190" height="92" rx="15" fill="#f2eef9" stroke="#b8a9d6"/><text x="781" y="83" text-anchor="middle" font-size="22" fill="#3e3454" font-weight="700">中央银行</text><text x="781" y="111" text-anchor="middle" font-size="14" fill="#625a72">现金 · 准备金 · 政策</text>
<path d="M214 78 H350" stroke="#147f80" stroke-width="3" marker-end="url(#arr1)"/><text x="282" y="65" text-anchor="middle" font-size="13" fill="#147f80">存款与支付</text>
<path d="M350 116 H214" stroke="#d06d4d" stroke-width="3" marker-end="url(#arr2)"/><text x="282" y="137" text-anchor="middle" font-size="13" fill="#b75a3c">贷款与融资</text>
<path d="M550 78 H686" stroke="#147f80" stroke-width="3" marker-end="url(#arr1)"/><text x="618" y="65" text-anchor="middle" font-size="13" fill="#147f80">准备金结算</text>
<path d="M686 116 H550" stroke="#d06d4d" stroke-width="3" marker-end="url(#arr2)"/><text x="618" y="137" text-anchor="middle" font-size="13" fill="#b75a3c">政策与流动性</text>
<rect x="170" y="218" width="560" height="72" rx="14" fill="#f6f5ef" stroke="#d9d4c4"/><text x="450" y="247" text-anchor="middle" font-size="20" fill="#354447" font-weight="700">金融市场与支付基础设施</text><text x="450" y="273" text-anchor="middle" font-size="14" fill="#627174">证券融资 · 风险转移 · 清算结算 · 价格发现</text>
<path d="M119 140 V184 H260 V218" fill="none" stroke="#9aa9a5" stroke-width="2" stroke-dasharray="5 5"/><path d="M450 140 V218" stroke="#9aa9a5" stroke-width="2" stroke-dasharray="5 5"/><path d="M781 140 V184 H640 V218" fill="none" stroke="#9aa9a5" stroke-width="2" stroke-dasharray="5 5"/>
</svg>