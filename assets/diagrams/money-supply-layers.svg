<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">中央银行货币与广义货币的层级</title><desc id="svg-desc">基础货币由流通现金与银行准备金构成；广义货币主要包括公众持有的现金和商业银行存款。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#147f80"/></marker><marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d06d4d"/></marker></defs><rect x="70" y="70" width="310" height="210" rx="14" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="225" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">中央银行货币 / 基础货币</text><text x="225" y="124" text-anchor="middle" font-size="13" fill="#53676d">央行负债</text><rect x="115" y="135" width="105" height="82" rx="14" fill="#fff" stroke="#9bb9af" stroke-width="2"/><text x="167.5" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">流通现金</text><text x="167.5" y="189" text-anchor="middle" font-size="13" fill="#53676d">公众持有</text><rect x="250" y="135" width="105" height="82" rx="14" fill="#fff" stroke="#9bb9af" stroke-width="2"/><text x="302.5" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">银行准备金</text><text x="302.5" y="189" text-anchor="middle" font-size="13" fill="#53676d">银行持有</text>
<rect x="520" y="70" width="310" height="210" rx="14" fill="#f4effb" stroke="#7461ba" stroke-width="2"/><text x="675" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">公众货币余额 / 广义货币</text><text x="675" y="124" text-anchor="middle" font-size="13" fill="#53676d">按各国统计口径定义</text><rect x="565" y="135" width="105" height="82" rx="14" fill="#fff" stroke="#9bb9af" stroke-width="2"/><text x="617.5" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">流通现金</text><text x="617.5" y="189" text-anchor="middle" font-size="13" fill="#53676d">公众持有</text><rect x="700" y="135" width="105" height="82" rx="14" fill="#fff" stroke="#9bb9af" stroke-width="2"/><text x="752.5" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">银行存款</text><text x="752.5" y="189" text-anchor="middle" font-size="13" fill="#53676d">公众持有</text>
<path d="M380 174 L520 174" stroke="#d06d4d" stroke-width="3" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="450" y="324" text-anchor="middle" font-size="14" fill="#53676d">准备金是银行在央行的资产，不是公众的银行存款</text></svg>