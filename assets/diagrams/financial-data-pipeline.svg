<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc" viewBox="0 0 900 360"><title id="svg-title">宏观金融数据的可复核工作流</title><desc id="svg-desc">从原始发布机构下载数据，核对指标口径和修订，计算转换指标，再做解释、记录反证与版本。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#147f80"/></marker></defs><rect width="900" height="360" rx="16" fill="#fffdf9"/><rect x="26" y="115" width="150" height="106" rx="15" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="101" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">原始发布</text><text x="101" y="176" text-anchor="middle" font-size="13" fill="#53676d">系列 ID 与时间</text><rect x="207" y="115" width="151" height="106" rx="15" fill="#f4effb" stroke="#7461ba" stroke-width="2"/><text x="282.5" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">口径校验</text><text x="282.5" y="176" text-anchor="middle" font-size="13" fill="#53676d">存量 / 流量</text><rect x="389" y="115" width="150" height="106" rx="15" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="464" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">转换计算</text><text x="464" y="176" text-anchor="middle" font-size="13" fill="#53676d">同比 / 频率</text><rect x="570" y="115" width="150" height="106" rx="15" fill="#fbf4df" stroke="#916c22" stroke-width="2"/><text x="645" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">机制判断</text><text x="645" y="176" text-anchor="middle" font-size="13" fill="#53676d">因果与替代</text><rect x="751" y="115" width="130" height="106" rx="15" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="816" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">归档复盘</text><text x="816" y="176" text-anchor="middle" font-size="13" fill="#53676d">版本与误差</text>
 <path d="M176 168 L207 168" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/><path d="M358 168 L389 168" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/><path d="M539 168 L570 168" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 168 L751 168" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/>
 <text x="450" y="54" text-anchor="middle" font-size="14" fill="#53676d">数据抓取成功不代表经济含义正确；每一次转换都需要记录</text>
 <text x="450" y="317" text-anchor="middle" font-size="13" fill="#53676d">缺失值、季度末、节假日和统计修订都会影响结论</text></svg>