<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc" viewBox="0 0 900 360"><title id="svg-title">央行公开文件的证据层次</title><desc id="svg-desc">政策决议描述已经作出的决定，执行报告与纪要解释背景，SEP 体现条件性个人预测。其信息形成时点并不相同。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#147f80"/></marker></defs><rect width="900" height="360" rx="16" fill="#fffdf9"/><rect x="26" y="126" width="190" height="104" rx="15" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="121" y="161" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">政策决定</text><text x="121" y="187" text-anchor="middle" font-size="13" fill="#53676d">当次声明与投票</text><rect x="272" y="40" width="195" height="96" rx="15" fill="#f7f8f4" stroke="#a6b8b0" stroke-width="2"/><text x="369.5" y="75" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">执行报告</text><text x="369.5" y="101" text-anchor="middle" font-size="13" fill="#53676d">操作与宏观资料</text><rect x="272" y="212" width="195" height="96" rx="15" fill="#f4effb" stroke="#7461ba" stroke-width="2"/><text x="369.5" y="247" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">会议纪要</text><text x="369.5" y="273" text-anchor="middle" font-size="13" fill="#53676d">讨论与分歧</text><rect x="546" y="126" width="185" height="104" rx="15" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="638.5" y="161" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">经济预测</text><text x="638.5" y="187" text-anchor="middle" font-size="13" fill="#53676d">条件性成员判断</text><rect x="785" y="126" width="90" height="104" rx="15" fill="#fbf4df" stroke="#916c22" stroke-width="2"/><text x="830" y="161" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">复核</text><text x="830" y="187" text-anchor="middle" font-size="13" fill="#53676d">后验检验</text>
 <path d="M216 176 L272 88" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/><path d="M216 176 L272 260" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/><path d="M467 88 L546 160" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/><path d="M467 260 L546 194" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/><path d="M731 178 L785 178" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/>
 <text x="450" y="343" text-anchor="middle" font-size="13" fill="#53676d">不同文件的形成时间、责任主体和预测性质不能相互替代</text></svg>