<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d">
<title id="t">信贷关系、银行存款创造与风险管理</title><desc id="d">银行评估借款人后发放贷款，银行资产端增加贷款、负债端增加借款人存款；支付将存款转移给收款人，之后借款人以现金流偿还本息。违约概率、违约损失率和违约风险暴露决定预期损失估计。</desc>
<rect x="30" y="54" width="180" height="92" rx="14" fill="#e8f4f1" stroke="#8dbab0"/><text x="120" y="88" text-anchor="middle" font-size="21" font-weight="700" fill="#203b3d">借款人</text><text x="120" y="116" text-anchor="middle" font-size="13" fill="#52676a">资金需求 · 还款现金流</text>
<rect x="360" y="54" width="180" height="92" rx="14" fill="#fff0e9" stroke="#d9a08c"/><text x="450" y="88" text-anchor="middle" font-size="21" font-weight="700" fill="#4b3028">商业银行</text><text x="450" y="116" text-anchor="middle" font-size="13" fill="#6b534b">贷款资产 · 存款负债</text>
<rect x="690" y="54" width="180" height="92" rx="14" fill="#f2eef9" stroke="#b8a9d6"/><text x="780" y="88" text-anchor="middle" font-size="21" font-weight="700" fill="#3e3454">收款方</text><text x="780" y="116" text-anchor="middle" font-size="13" fill="#625a72">商品 · 工资 · 服务</text>
<path d="M210 78 H360" stroke="#147f80" stroke-width="3"/><path d="M350 71 L360 78 L350 85" fill="none" stroke="#147f80" stroke-width="3"/><text x="285" y="62" text-anchor="middle" font-size="13" fill="#147f80">授信申请</text>
<path d="M360 122 H210" stroke="#d06d4d" stroke-width="3"/><path d="M220 115 L210 122 L220 129" fill="none" stroke="#d06d4d" stroke-width="3"/><text x="285" y="143" text-anchor="middle" font-size="13" fill="#b75a3c">贷款 + 存款</text>
<path d="M540 78 H690" stroke="#147f80" stroke-width="3"/><path d="M680 71 L690 78 L680 85" fill="none" stroke="#147f80" stroke-width="3"/><text x="615" y="62" text-anchor="middle" font-size="13" fill="#147f80">支付转账</text>
<rect x="150" y="220" width="600" height="78" rx="14" fill="#f7f4e8" stroke="#c9b87b"/><text x="450" y="250" text-anchor="middle" font-size="19" font-weight="700" fill="#514524">信用风险评估与贷后管理</text><text x="450" y="276" text-anchor="middle" font-size="14" fill="#6b603f">PD 违约概率 · LGD 违约损失率 · EAD 违约风险暴露</text>
<path d="M450 146 V220" stroke="#9aa9a5" stroke-width="2" stroke-dasharray="5 5"/>
</svg>