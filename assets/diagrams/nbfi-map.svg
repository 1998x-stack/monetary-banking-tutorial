<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">非银行金融中介的资金与风险网络</title><desc id="svg-desc">资金提供者通过保险、基金、信托和证券机构进入资本市场与实体经济，银行与非银行机构之间存在融资和持仓联系。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#147f80"/></marker><marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d06d4d"/></marker></defs><rect x="24" y="120" width="150" height="110" rx="16" fill="#f1f6f3" stroke="#9bb9af"/><text x="99" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">资金提供者</text><text x="99" y="188" text-anchor="middle" font-size="14" fill="#53676d">家庭 · 企业</text>
<rect x="250" y="28" width="170" height="74" rx="14" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="335" y="58" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">保险 / 养老</text><text x="335" y="82" text-anchor="middle" font-size="13" fill="#53676d">长期负债</text>
<rect x="250" y="142" width="170" height="74" rx="14" fill="#f4effb" stroke="#7461ba" stroke-width="2"/><text x="335" y="172" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">基金 / 资管</text><text x="335" y="196" text-anchor="middle" font-size="13" fill="#53676d">集合投资</text>
<rect x="250" y="256" width="170" height="74" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="335" y="286" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">信托 / 融资公司</text><text x="335" y="310" text-anchor="middle" font-size="13" fill="#53676d">受托与专业信贷</text>
<rect x="520" y="95" width="165" height="88" rx="14" fill="#f7f8f4" stroke="#a6b8b0" stroke-width="2"/><text x="602.5" y="125" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">金融市场</text><text x="602.5" y="149" text-anchor="middle" font-size="13" fill="#53676d">债券 · 股票 · 回购</text>
<rect x="745" y="95" width="130" height="88" rx="14" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="810" y="125" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">融资者</text><text x="810" y="149" text-anchor="middle" font-size="13" fill="#53676d">企业 · 政府</text>
<path d="M174 165 L250 65" stroke="#147f80" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M174 175 L250 179" stroke="#147f80" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M174 185 L250 293" stroke="#147f80" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M420 65 L520 120" stroke="#147f80" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M420 179 L520 139" stroke="#147f80" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M420 293 L520 163" stroke="#147f80" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M685 139 L745 139" stroke="#147f80" stroke-width="3" fill="none"  marker-end="url(#arrow)"/>
<path d="M600 183 C600 245 420 245 420 216" fill="none" stroke="#d06d4d" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-warm)"/><text x="520" y="264" text-anchor="middle" font-size="13" fill="#a4553b">融资、抵押品与市场价格联系</text>
<text x="450" y="340" text-anchor="middle" font-size="13" fill="#53676d">资金流与风险敞口并不沿单一路径移动</text></svg>