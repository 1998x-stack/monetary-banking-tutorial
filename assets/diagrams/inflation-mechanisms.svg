<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">通胀的三类来源与价格反馈</title><desc id="svg-desc">需求扩张、成本冲击和通胀预期共同影响企业成本、工资与定价，最终反映在广泛价格指数中。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#147f80"/></marker><marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d06d4d"/></marker></defs><rect x="30" y="45" width="185" height="76" rx="14" fill="#e8f4f1" stroke="#147f80" stroke-width="2"/><text x="122.5" y="75" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">需求扩张</text><text x="122.5" y="99" text-anchor="middle" font-size="13" fill="#53676d">消费 · 投资 · 财政</text><rect x="30" y="145" width="185" height="76" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="122.5" y="175" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">成本冲击</text><text x="122.5" y="199" text-anchor="middle" font-size="13" fill="#53676d">能源 · 工资 · 供应</text><rect x="30" y="245" width="185" height="76" rx="14" fill="#f4effb" stroke="#7461ba" stroke-width="2"/><text x="122.5" y="275" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">预期变化</text><text x="122.5" y="299" text-anchor="middle" font-size="13" fill="#53676d">工资合同 · 定价</text>
<rect x="335" y="125" width="220" height="110" rx="14" fill="#f7f8f4" stroke="#a6b8b0" stroke-width="2"/><text x="445" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">企业定价与工资</text><text x="445" y="179" text-anchor="middle" font-size="13" fill="#53676d">利润率 · 成本转嫁</text>
<rect x="680" y="125" width="185" height="110" rx="14" fill="#fbf4df" stroke="#916c22" stroke-width="2"/><text x="772.5" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">广泛价格指数</text><text x="772.5" y="179" text-anchor="middle" font-size="13" fill="#53676d">CPI · PCE · 平减指数</text>
