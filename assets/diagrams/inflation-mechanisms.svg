<path d="M770 235 C770 330 120 330 120 321" fill="none" stroke="#916c22" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="450" y="347" text-anchor="middle" font-size="12" fill="#53676d">预期反馈可能延长一次性冲击的持续时间</text></svg>